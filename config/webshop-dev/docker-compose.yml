services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .webshop-db.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - webshop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webshop}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  webshop-postgres:

openapi: 3.0.3
info:
  title: Company Webshop API
  version: 1.0.0
  description: HTTP API for the Catalog, Inventory, and Ordering modules.
servers:
  - url: http://localhost:5080
paths:
  /catalog/products:
    post:
      tags: [Catalog]
      operationId: registerProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterProduct' }
      responses:
        '201': { description: Product registered }
        '400': { $ref: '#/components/responses/BadRequest' }
  /catalog/products/{productId}:
    get:
      tags: [Catalog]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { description: Product found }
        '404': { description: Product not found }
  /catalog/products/{productId}/publish:
    post:
      tags: [Catalog]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '204': { description: Product published }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Product not found }
  /catalog/products/{productId}/discontinue:
    post:
      tags: [Catalog]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '204': { description: Product discontinued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Product not found }
  /inventory/products/{productId}:
    get:
      tags: [Inventory]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { description: Stock found }
        '404': { description: Stock not found }
  /inventory/products/{productId}/replenish:
    post:
      tags: [Inventory]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplenishStock' }
      responses:
        '204': { description: Stock replenished }
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders:
    post:
      tags: [Ordering]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrder' }
      responses:
        '201': { description: Order placed and workflow dispatched }
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders/{orderId}:
    get:
      tags: [Ordering]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Order found }
        '404': { description: Order not found }
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterProduct:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: number, format: decimal }
    ReplenishStock:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    PlaceOrder:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: A business rule was violated
